apiConfig:
  configYaml: |-
      name: ${WEBAPP_DEPLOYMENT_NAME}
      webapp:
        domainName: "${API_DNS_NAME}"
        publicUrl: "${WEBAPP_PUBLIC_URL}"
        server:
          nodeSelector:
            "cosmotech.com/tier": "services"
          image:
            pullSecret: ""
            repository: "${IMAGE_REPOSITORY_SERVER}"
            tag: latest
            pullPolicy: Always
        functions:
          nodeSelector:
            "cosmotech.com/tier": "services"
          image:
            pullSecret: ""
            repository: "${IMAGE_REPOSITORY_FUNCTIONS}"
            tag: latest
            pullPolicy: Always
      keycloak:
        realmUrl: "${KEYCLOAK_URL_AUTH}"
      powerbi:
        tenantId: "${POWERBI_APP_TENANT_ID}"
        clientId: "${POWERBI_APP_CLIENT_ID}"
        clientSecret: "${POWERBI_APP_SECRET}"
      ingress:
        enabled: true
      resources:
        limits:
          cpu: 1000m
          memory: 256Mi
        requests:
          cpu: 200m
          memory: 128Mi
host: ${API_DNS_NAME}
hostPathContext: eng-test-dev/brewery-listener
registryUrl: cosmo-tech.github.io/helm-charts/
chartName: cosmotech-business-webapp
chartVersion: ${WEBAPP_CHART_VERSION}
apiGithubWebhookSecret:
  secretToken: ${WEBHOOK_SECRET}
apiDockerSecret:
  dockerconfigjson: ${DOCKER_SECRET}
tolerations:
  - key: "vendor"
    operator: "Equal"
    value: "tekton"
    effect: "NoSchedule"
nodeSelector:
  "cosmotech.com/tier": "services"
  "kubernetes.io/os": "linux"
ingressType: "${INGRESS_TYPE}"
ngrokHost: "${NGROK_HOST}"
helmChartPullType: "${HELM_CHART_PULL_TYPE}"
runCypressTests: '"true"'
webAppRepoUrl: "https://github.com/Cosmo-Tech/azure-sample-webapp.git"
webAppRevision: "experimental/on_premises_api_v4"
cypressBaseUrl: "${API_DNS_NAME}${WEBAPP_PUBLIC_URL}"
authKeycloakRealm: "${KEYCLOAK_URL_AUTH}"
authKeycloakClientId: "cosmotech-webapp-cypress-service-account"
authKeycloakClientSecret: "test1234"