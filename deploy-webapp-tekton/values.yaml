apiConfig:
  configYaml: |-
      name: ${WEBAPP_DEPLOYMENT_NAME}
      webapp:
        domainName: "${API_DNS_NAME}"
        publicUrl: "${WEBAPP_PUBLIC_URL}"
        server:
          nodeSelector:
            "cosmotech.com/tier": "services"
          image:
            pullSecret: ""
            repository: "${IMAGE_REPOSITORY_SERVER}"
            tag: latest
            pullPolicy: Always
        functions:
          nodeSelector:
            "cosmotech.com/tier": "services"
          image:
            pullSecret: ""
            repository: "${IMAGE_REPOSITORY_FUNCTIONS}"
            tag: latest
            pullPolicy: Always
      keycloak:
        realmUrl: "${KEYCLOAK_URL_AUTH}"
      powerbi:
        tenantId: "${POWERBI_APP_TENANT_ID}"
        clientId: "${POWERBI_APP_CLIENT_ID}"
        clientSecret: "${POWERBI_APP_SECRET}"
      ingress:
        enabled: true
      resources:
        limits:
          cpu: 1000m
          memory: 256Mi
        requests:
          cpu: 200m
          memory: 128Mi
host: ${API_DNS_NAME}
host_path_context: eng-test-dev/brewery-listener
registry_url: cosmo-tech.github.io/helm-charts/
chart_name: cosmotech-business-webapp
chart_version: 0.2.1
ApiGithubWebhookSecret:
  secretToken: ${WEBHOOK_SECRET}
ApiDockerSecret:
  dockerconfigjson: ${DOCKER_SECRET}
tolerations:
  - key: "vendor"
    operator: "Equal"
    value: "tekton"
    effect: "NoSchedule"
nodeSelector:
  "cosmotech.com/tier": "services"
  "kubernetes.io/os": "linux"
ingress_type: "${INGRESS_TYPE}"
ngrok_host: "${NGROK_HOST}"
helm_chart_pull_type: "${HELM_CHART_PULL_TYPE}"